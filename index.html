<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetics Lab & Pasture</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            margin: 0;
        }
        h1, h2, h3 { color: #4a4af5; margin-top: 0; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab-btn { background: #2a2a3a; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 13px; }
        .tab-btn.active { background: #4a4af5; }
        .notif-btn { background: #34495e; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 13px; }
        .raha-naytto { background: #27ae60; color: white; padding: 6px 12px; border-radius: 5px; font-weight: bold; font-size: 13px; }

        .page { display: none; }
        .page.active { display: block; }

        .lauma-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

        .elain-kortti {
            background-color: #222232;
            border: 2px solid #3a3a52;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .elain-kortti:active { transform: scale(0.98); }
        .elain-kortti.selected { border-color: #f1c40f; background-color: #2a2a4a; }
        
        .kortti-kuva-alue {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #1a1a24;
            border-radius: 6px;
            padding: 4px;
        }

        .kortti-info { width: 100%; text-align: center; margin-top: 4px; }
        .kortti-laajennus {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            font-size: 12px;
            text-align: left;
            width: 100%;
        }
        .elain-kortti.auki .kortti-laajennus {
            max-height: 300px;
            border-top: 1px solid #3a3a52;
            padding-top: 6px;
            margin-top: 4px;
        }

        /* JALOSTUSSIVU MOBIILILOUT */
        .breed-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .breed-column { 
            flex: 1; 
            background: #222232; 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px solid #3a3a52; 
            min-width: 280px;
            max-height: 450px;
            display: flex;
            flex-direction: column;
        }
        .breed-scroll-area {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .breed-center-top {
            background: #222232;
            border: 2px solid #4a4af5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .vanhempi-box { display: flex; align-items: center; gap: 10px; background: #1a1a24; padding: 8px; border-radius: 6px; flex: 1; min-width: 200px; }
        .keski-kontrollit { text-align: center; flex: 1; min-width: 180px; }

        .shop-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .shop-box { background: #222232; border: 2px solid #3a3a52; border-radius: 8px; padding: 15px; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #222232; margin: 10% auto; padding: 15px; border: 2px solid #4a4af5; border-radius: 8px; width: 90%; max-width: 500px; color: white; }
        .close-btn { color: #aaa; float: right; font-size: 24px; font-weight: bold; cursor: pointer; }

        #tarha-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #27ae60;
            border: 3px solid #3a3a52;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }
        #tarha-canvas { width: 100%; height: 100%; display: block; }

        button.action-btn {
            background-color: #4a4af5; color: white; border: none; padding: 10px 15px; 
            font-size: 14px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px;
        }
        button.action-btn:disabled { background-color: #444; color: #888; }
        button.sell-btn { background-color: #e74c3c; padding: 4px 8px; font-size: 11px; border:none; border-radius:4px; color:white; font-weight:bold; }
        button.tree-btn { background-color: #34495e; padding: 4px 8px; font-size: 11px; border:none; border-radius:4px; color:white; font-weight:bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="tabs">
            <button class="tab-btn active" onclick="vaihdaSivua('lab-sivu', event)">🔬 Labra</button>
            <button class="tab-btn" onclick="vaihdaSivua('jalostus-sivu', event)">❤️ Jalostus</button>
            <button class="tab-btn" onclick="vaihdaSivua('kauppa-sivu', event)">🛒 Kauppa</button>
            <button class="tab-btn" onclick="vaihdaSivua('geenikirja-sivu', event)">📖 Kirjasto</button>
            <button class="tab-btn" onclick="vaihdaSivua('tarha-sivu', event)">🌳 Tarha</button>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="raha-naytto">💰 <span id="pelaaja-raha">150</span> €</div>
            <button class="notif-btn" onclick="avaaModal('ilmoitus-modal')">🔔</button>
        </div>
    </div>

    <div id="ilmoitus-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="suljeModaalit()">&times;</span>
            <h3>Ilmoitukset</h3>
            <div id="ilmoitus-lista" style="max-height: 200px; overflow-y: auto; font-size: 12px;"></div>
        </div>
    </div>

    <div id="sukupuu-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="suljeModaalit()">&times;</span>
            <h3 id="sukupuu-otsikko">Sukupuu</h3>
            <div id="sukupuu-sisalto" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- SIVU 1: LABORATORIO -->
    <div id="lab-sivu" class="page active">
        <button class="action-btn" style="background-color: #2ecc71; margin-bottom: 15px; width: auto;" onclick="seuraavaPaivaRollover()">☀️ Seuraava päivä</button>
        <h2>Sinun Laumasi (<span id="lauma-maara">0</span>)</h2>
        <div id="lauma-alue" class="lauma-grid"></div>
    </div>

    <!-- SIVU 2: JALOSTUSSIVU -->
    <div id="jalostus-sivu" class="page">
        <div class="breed-center-top">
            <div class="vanhempi-box">
                <canvas id="iso-valittu-uros" width="100" height="100" style="background:#111; border-radius:6px;"></canvas>
                <div>
                    <div id="nimi-valittu-uros" style="font-weight: bold; color: #4a4af5; font-size: 14px;">Valitse uros (♂)</div>
                    <div id="geenit-valittu-uros" style="font-size: 11px; color: #aaa;">Geenit: -</div>
                </div>
            </div>

            <div class="keski-kontrollit">
                <div id="inbreeding-varoitus" style="color: #e74c3c; font-weight: bold; font-size: 11px;"></div>
                <button id="breed-btn" class="action-btn" disabled onclick="suoritaRisteytys()">RISTEYTÄ</button>
            </div>

            <div class="vanhempi-box" style="flex-direction: row-reverse; text-align: right;">
                <canvas id="iso-valittu-naaras" width="100" height="100" style="background:#111; border-radius:6px;"></canvas>
                <div>
                    <div id="nimi-valittu-naaras" style="font-weight: bold; color: #e74c3c; font-size: 14px;">Valitse naaras (♀)</div>
                    <div id="geenit-valittu-naaras" style="font-size: 11px; color: #aaa;">Geenit: -</div>
                </div>
            </div>
        </div>

        <div class="breed-container">
            <div class="breed-column">
                <h3 style="margin-bottom:8px; color:#4a4af5; font-size:14px;">Urokset (♂)</h3>
                <div id="jalostus-koiraat" class="breed-scroll-area"></div>
            </div>
            <div class="breed-column">
                <h3 style="margin-bottom:8px; color:#e74c3c; font-size:14px;">Naaraat (♀)</h3>
                <div id="jalostus-naaraat" class="breed-scroll-area"></div>
            </div>
        </div>
    </div>

    <!-- SIVU 3: KAUPPA -->
    <div id="kauppa-sivu" class="page">
        <h2>Kauppa</h2>
        <div class="shop-container">
            <div class="shop-box">
                <h3>🧬 Uusi Eläin</h3>
                <button class="action-btn" onclick="ostaOlento('uros')">Osta Uros (♂) – 100 €</button>
                <button class="action-btn" style="background-color: #e74c3c;" onclick="ostaOlento('naaras')">Osta Naaras (♀) – 100 €</button>
            </div>
        </div>
    </div>

    <!-- SIVU 4: GEENIKIRJASTO -->
    <div id="geenikirja-sivu" class="page">
        <h2>📖 Geenikirjasto</h2>
        <div id="codex-alue"></div>
    </div>

    <!-- SIVU 5: TARHANÄKYMÄ -->
    <div id="tarha-sivu" class="page">
        <h2>Tepsuttelutarha</h2>
        <div id="tarha-container">
            <canvas id="tarha-canvas" width="1000" height="550"></canvas>
        </div>
    </div>

    <script>
        const kuvat = {};
        const kuvaTiedostot = {
            hanta_viivat: "Untitled322_20261013221346.png",
            hanta_vari: "Untitled322_20261013221351.png",
            kauempi_takajalka_viivat: "Untitled322_20261013221356.png",
            kauempi_takajalka_vari: "Untitled322_20261013221400.png",
            lahempi_takajalka_viivat: "Untitled322_20261013221405.png",
            lahempi_takajalka_vari: "Untitled322_20261013221410.png",
            taaempi_etujalka_viivat: "Untitled322_20261013221416.png",
            taaempi_etujalka_vari: "Untitled322_20261013221421.png",
            lahempi_etujalka_viivat: "Untitled322_20261013221426.png",
            lahempi_etujalka_vari: "Untitled322_20261013221431.png",
            keho_viivat: "Untitled322_20261013221523.png",
            keho_vari: "Untitled322_20261013221527.png",
            kaula_rinta_viivat: "Untitled322_20261013221532.png",
            kaula_rinta_vari: "Untitled322_20261013221535.png",
            silma_viivat: "Untitled322_20261013221540.png",
            pupilli_vari: "Untitled322_20261013221545.png",
            iho_pieni: "Untitled322_20261013221551.png",
            silma_vari: "Untitled322_20261013221556.png",
            nena_viivat: "Untitled322_20261013221600.png",
            nena_vari: "Untitled322_20261013221605.png",
            lahempi_korva_viivat: "Untitled322_20261013221610.png",
            lahempi_korva_vari: "Untitled322_20261013221614.png",
            korva_sisa_vari: "Untitled322_20261013221619.png",
            kauempi_korva_viivat: "Untitled322_20261013221624.png",
            kauempi_korva_vari: "Untitled322_20261013221628.png",
            paa_viivat: "Untitled322_20261013221633.png",
            paa_vari: "Untitled322_20261013221638.png"
        };

        let ladatutKuvat = 0;
        let kaikkiKuvatLadattu = false;
        const kuviaYhteensa = Object.keys(kuvaTiedostot).length;

        function lataaKuvat(callback) {
            for (let avain in kuvaTiedostot) {
                kuvat[avain] = new Image();
                kuvat[avain].src = kuvaTiedostot[avain];
                kuvat[avain].onload = () => {
                    ladatutKuvat++;
                    if (ladatutKuvat === kuviaYhteensa) {
                        kaikkiKuvatLadattu = true;
                        callback();
                    }
                };
            }
        }

        let lauma = [];
        let raha = 150;
        let valittuUros = null;
        let valittuNaaras = null;
        let ilmoitukset = [];
        let tarhaOlennot = [];
        let tarhaAnimaatioId = null;

        const offscreenCanvas = document.createElement("canvas");
        offscreenCanvas.width = 2163;
        offscreenCanvas.height = 1361;
        const offCtx = offscreenCanvas.getContext("2d");

        function avaaModal(id) { document.getElementById(id).style.display = "block"; }
        function suljeModaalit() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        function lisaaIlmoitus(teksti) {
            ilmoitukset.unshift(`[${new Date().toLocaleTimeString()}] ${teksti}`);
            if (ilmoitukset.length > 20) ilmoitukset.pop();
            document.getElementById("ilmoitus-lista").innerHTML = ilmoitukset.map(i => `<div style="padding:3px 0;">${i}</div>`).join("");
        }

        function arvoAlleeli(genotyyppi) {
            let alleelit = [genotyyppi[0], genotyyppi[1]];
            return alleelit[Math.floor(Math.random() * 2)];
        }

        function luoOlento(nimi, sukupuoli, isag, emag, ika, ikaPaivat = 0) {
            let realG = {
                B: arvoAlleeli(isag.B || "Bb") + arvoAlleeli(emag.B || "Bb"),
                N: arvoAlleeli(isag.N || "Nn") + arvoAlleeli(emag.N || "Nn"),
                D: arvoAlleeli(isag.D || "Dd") + arvoAlleeli(emag.D || "Dd")
            };

            let calicoSpots = [];
            if (realG.N === "Nn") {
                for(let i = 0; i < 6; i++) {
                    calicoSpots.push({ x: Math.random() * 1000 + 400, y: Math.random() * 500 + 400, r: Math.random() * 80 + 30 });
                }
            }

            return {
                id: Date.now() + Math.floor(Math.random() * 10000),
                nimi: nimi,
                sukupuoli: sukupuoli,
                ika: ika,
                ikaPaivat: ikaPaivat,
                tiineysPaivat: 0,
                realGenotype: realG,
                eyeColor: "#2ecc71",
                skinColor: "#ffb6c1",
                calicoSpots: calicoSpots
            };
        }

        function paivitaKaikkiUI() {
            document.getElementById("pelaaja-raha").innerText = raha;
            paivitaLaumaUI();
            paivitaJalostusUI();
            alustaTarhaOlennot();
            localStorage.setItem("laji_lauma_v25", JSON.stringify(lauma));
            localStorage.setItem("laji_raha_v25", raha);
        }

        function paivitaLaumaUI() {
            const alue = document.getElementById("lauma-alue");
            if (!alue) return;
            alue.innerHTML = "";
            document.getElementById("lauma-maara").innerText = lauma.length;

            lauma.forEach(elain => {
                const kortti = document.createElement("div");
                kortti.className = "elain-kortti";
                
                kortti.innerHTML = `
                    <div class="kortti-kuva-alue">
                        <canvas id="canvas-kortti-${elain.id}" width="150" height="130"></canvas>
                    </div>
                    <div class="kortti-info">
                        <h4 style="margin:0; font-size:13px;">${elain.nimi} (${elain.sukupuoli})</h4>
                        <p style="font-size:10px; color:#aaa; margin:2px 0;">${elain.ika} (${elain.ikaPaivat} pv)</p>
                    </div>
                `;

                alue.appendChild(kortti);

                const canvas = document.getElementById(`canvas-kortti-${elain.id}`);
                const ctx = canvas.getContext("2d");
                ctx.translate(75, 75);
                
                let asento = "seisoo";
                let scale = 0.065;
                if (elain.ika === "pentu") {
                    if (elain.ikaPaivat === 0) { asento = "makaa"; scale = 0.035; }
                    else if (elain.ikaPaivat <= 2) { asento = "istuu"; scale = 0.045; }
                    else if (elain.ikaPaivat === 3) { scale = 0.055; }
                }

                piirraKerrokset(ctx, elain, false, 0, asento, scale);
            });
        }

        function paivitaJalostusUI() {
            const koiraat = document.getElementById("jalostus-koiraat");
            const naaraat = document.getElementById("jalostus-naaraat");
            if (!koiraat || !naaraat) return;

            koiraat.innerHTML = ""; naaraat.innerHTML = "";

            lauma.forEach(elain => {
                const div = document.createElement("div");
                div.style.cssText = "background:#1a1a24; padding:6px; border-radius:4px; display:flex; align-items:center; gap:8px; cursor:pointer;";
                if (valittuUros?.id === elain.id || valittuNaaras?.id === elain.id) div.style.border = "2px solid #f1c40f";

                div.innerHTML = `<span style="font-size:12px; font-weight:bold;">${elain.nimi}</span>`;
                div.onclick = () => {
                    if (elain.ika === "pentu") return;
                    if (elain.sukupuoli === "♂") valittuUros = elain;
                    else valittuNaaras = elain;
                    paivitaJalostusUI();
                };

                if (elain.sukupuoli === "♂") koiraat.appendChild(div);
                else naaraat.appendChild(div);
            });

            document.getElementById("breed-btn").disabled = !(valittuUros && valittuNaaras);
            if (valittuUros) document.getElementById("nimi-valittu-uros").innerText = valittuUros.nimi;
            if (valittuNaaras) document.getElementById("nimi-valittu-naaras").innerText = valittuNaaras.nimi;
        }

        function suoritaRisteytys() {
            if (!valittuUros || !valittuNaaras) return;
            valittuNaaras.tiineysPaivat = 1;
            valittuNaaras.viimeisinIsa = { ...valittuUros };
            lisaaIlmoitus(`❤️ ${valittuNaaras.nimi} astutettiin!`);
            valittuUros = null; valittuNaaras = null;
            paivitaKaikkiUI();
        }

        function seuraavaPaivaRollover() {
            lauma.forEach(elain => {
                if (elain.ika === "pentu") {
                    elain.ikaPaivat += 1;
                    if (elain.ikaPaivat >= 4) elain.ika = "aikuinen";
                }
                if (elain.sukupuoli === "♀" && elain.tiineysPaivat > 0) {
                    elain.tiineysPaivat += 1;
                    if (elain.tiineysPaivat > 2) {
                        elain.tiineysPaivat = 0;
                        let uusi = luoOlento("Pentu-" + (lauma.length + 1), Math.random() < 0.5 ? "♂" : "♀", elain.viimeisinIsa.realGenotype, elain.realGenotype, "pentu", 0);
                        lauma.push(uusi);
                        lisaaIlmoitus(`🍼 Uusi pentu syntynyt: ${uusi.nimi}!`);
                    }
                }
            });
            paivitaKaikkiUI();
        }

        /* TARKKA, STAATTISIA PISTEITÄ KÄYTTÄVÄ PIIRTOKERROSLOGIIKKA (EI IRTOAVIA OSIA) */
        function piirraKerrokset(ctx, elain, flipX, liike = 0, asento = "seisoo", scale = 0.065) {
            if (!kaikkiKuvatLadattu) return;

            ctx.save();
            if (flipX) ctx.scale(-1, 1);

            let g = elain.realGenotype;
            let turkinVari = (g.N === "nn") ? "#e67e22" : (g.B.includes("bb") ? "#8b5a2b" : "#222222");
            if (g.D.includes("d")) turkinVari = (g.N === "nn") ? "#f5deb3" : "#555566";

            const w = 2163; const h = 1361;
            ctx.scale(scale, scale);
            const ox = -w / 2; const oy = -h / 2;

            function piirraOsa(variImg, viivaImg, vari, isKeho = false) {
                if (variImg && variImg.complete) {
                    offCtx.clearRect(0, 0, w, h);
                    offCtx.drawImage(variImg, 0, 0, w, h);
                    offCtx.globalCompositeOperation = "source-in";
                    offCtx.fillStyle = vari;
                    offCtx.fillRect(0, 0, w, h);

                    if (isKeho && g.N === "Nn" && elain.calicoSpots) {
                        offCtx.globalCompositeOperation = "source-atop";
                        offCtx.fillStyle = "#e67e22";
                        elain.calicoSpots.forEach(s => { offCtx.beginPath(); offCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); offCtx.fill(); });
                    }
                    ctx.drawImage(offscreenCanvas, ox, oy, w, h);
                }
                if (viivaImg && viivaImg.complete) ctx.drawImage(viivaImg, ox, oy, w, h);
            }

            let kehoOffsetY = (asento === "makaa") ? 180 : (asento === "istuu" ? 90 : 0);
            let jalkaKulma = (asento === "seisoo") ? Math.sin(liike) * 0.2 : 0;

            ctx.save();
            ctx.translate(0, kehoOffsetY);

            // Taustaosat
            piirraOsa(kuvat.hanta_vari, kuvat.hanta_viivat, turkinVari);
            
            // Kauempi takajalka
            ctx.save(); ctx.rotate(jalkaKulma); piirraOsa(kuvat.kauempi_takajalka_vari, kuvat.kauempi_takajalka_viivat, turkinVari); ctx.restore();
            // Taaempi etujalka
            ctx.save(); ctx.rotate(-jalkaKulma); piirraOsa(kuvat.taaempi_etujalka_vari, kuvat.taaempi_etujalka_viivat, turkinVari); ctx.restore();

            // Keho
            piirraOsa(kuvat.kaula_rinta_vari, kuvat.kaula_rinta_viivat, turkinVari);
            piirraOsa(kuvat.keho_vari, kuvat.keho_viivat, turkinVari, true);

            // Etuala-raajat
            ctx.save(); ctx.rotate(jalkaKulma); piirraOsa(kuvat.lahempi_etujalka_vari, kuvat.lahempi_etujalka_viivat, turkinVari); ctx.restore();
            ctx.save(); ctx.rotate(-jalkaKulma); piirraOsa(kuvat.lahempi_takajalka_vari, kuvat.lahempi_takajalka_viivat, turkinVari); ctx.restore();

            // Pää ja kasvot
            piirraOsa(kuvat.kauempi_korva_vari, kuvat.kauempi_korva_viivat, turkinVari);
            piirraOsa(kuvat.paa_vari, kuvat.paa_viivat, turkinVari);
            
            // Silmä (kiinni jos 0pv vauva)
            if (!(elain.ika === "pentu" && elain.ikaPaivat === 0)) {
                piirraOsa(kuvat.silma_vari, kuvat.silma_viivat, elain.eyeColor);
                if (kuvat.pupilli_vari && kuvat.pupilli_vari.complete) ctx.drawImage(kuvat.pupilli_vari, ox, oy, w, h);
            } else {
                if (kuvat.silma_viivat) ctx.drawImage(kuvat.silma_viivat, ox, oy, w, h);
            }

            piirraOsa(kuvat.korva_sisa_vari, null, elain.skinColor);
            piirraOsa(kuvat.lahempi_korva_vari, kuvat.lahempi_korva_viivat, turkinVari);

            ctx.restore();
            ctx.restore();
        }

        class TarhaOlento {
            constructor(data) {
                this.data = data;
                this.x = Math.random() * 600 + 200;
                this.y = Math.random() * 150 + 320;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.liike = 0;
            }

            paivita(w, h) {
                if (this.data.ikaPaivat < 3) return; // Pennut (0-2pv) pysyvät paikallaan
                this.x += this.vx;
                this.liike += 0.1;
                if (this.x < 100 || this.x > w - 100) this.vx *= -1;
            }

            piirra(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                let flip = this.vx < 0;
                let scale = 0.07;
                if (this.data.ika === "pentu" && this.data.ikaPaivat === 3) scale = 0.055;

                piirraKerrokset(ctx, this.data, flip, this.liike, "seisoo", scale);
                ctx.restore();
            }
        }

        function alustaTarhaOlennot() {
            tarhaOlennot = lauma.filter(e => e.ika === "aikuinen" || e.ikaPaivat >= 3).map(e => new TarhaOlento(e));
        }

        function paivitaTarhaLoop() {
            const canvas = document.getElementById("tarha-canvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#27ae60"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            tarhaOlennot.sort((a,b) => a.y - b.y);
            tarhaOlennot.forEach(o => { o.paivita(canvas.width, canvas.height); o.piirra(ctx); });

            tarhaAnimaatioId = requestAnimationFrame(paivitaTarhaLoop);
        }

        function vaihdaSivua(id, event) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (event) event.target.classList.add('active');

            if (id === 'tarha-sivu') {
                alustaTarhaOlennot();
                if (!tarhaAnimaatioId) paivitaTarhaLoop();
            } else {
                if (tarhaAnimaatioId) { cancelAnimationFrame(tarhaAnimaatioId); tarhaAnimaatioId = null; }
            }
        }

        function ostaOlento(sukupuoli) {
            if (raha < 100) return;
            raha -= 100;
            lauma.push(luoOlento("Tuonti-" + (lauma.length + 1), sukupuoli, {B:"Bb", N:"NN", D:"Dd"}, {B:"Bb", N:"NN", D:"Dd"}, "aikuinen", 4));
            paivitaKaikkiUI();
        }

        function lataaPeli() {
            let tLauma = localStorage.getItem("laji_lauma_v25");
            let tRaha = localStorage.getItem("laji_raha_v25");

            if (tLauma) lauma = JSON.parse(tLauma);
            if (tRaha) raha = parseInt(tRaha);

            if (lauma.length === 0) {
                lauma.push(luoOlento("Uros", "♂", {B:"BB", N:"NN", D:"DD"}, {B:"BB", N:"NN", D:"DD"}, "aikuinen", 4));
                lauma.push(luoOlento("Naaras", "♀", {B:"bb", N:"nn", D:"dd"}, {B:"bb", N:"nn", D:"dd"}, "aikuinen", 4));
            }
            paivitaKaikkiUI();
        }

        window.onload = () => { lataaKuvat(() => lataaPeli()); };
    </script>
</body>
